<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeGraphKM</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      p {
        color: #94a3b8;
      }
      button {
        background: #38bdf8;
        border: none;
        color: #0f172a;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        font-weight: 600;
        cursor: pointer;
      }
      pre {
        background: #1e293b;
        padding: 1rem;
        border-radius: 0.75rem;
        overflow: auto;
        min-height: 240px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .card {
        background: #1e293b;
        border-radius: 0.75rem;
        padding: 1rem;
      }
      .card strong {
        display: block;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>KnowledgeGraphKM</h1>
      <p>Build a knowledge graph from the internal organizational database.</p>
      <button id="sync">Sync graph from internal DB</button>
      <div class="stats">
        <div class="card"><strong id="node-count">0</strong>Nodes</div>
        <div class="card"><strong id="edge-count">0</strong>Edges</div>
        <div class="card"><strong id="employee-count">0</strong>Employees</div>
      </div>
      <pre id="output">Click sync to build the graph.</pre>
    </main>
    <script>
      async function syncGraph() {
        const output = document.getElementById("output");
        output.textContent = "Syncing...";
        const [graphResponse, employeesResponse] = await Promise.all([
          fetch("/api/graph/sync", { method: "POST" }),
          fetch("/api/employees"),
        ]);
        const graph = await graphResponse.json();
        const employees = await employeesResponse.json();
        document.getElementById("node-count").textContent = graph.nodes.length;
        document.getElementById("edge-count").textContent = graph.edges.length;
        document.getElementById("employee-count").textContent = employees.length;
        output.textContent = JSON.stringify(graph, null, 2);
      }
      document.getElementById("sync").addEventListener("click", syncGraph);
    </script>
  </body>
</html>
